name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Assemble Windows package
        run: |
          cp packaging/START-MTG-CARD-LIBRARY.bat dist/
          cp packaging/mtg-server.ps1 dist/
          cp packaging/README-WINDOWS.txt dist/
          cp packaging/VERSION.txt dist/
          cd dist
          zip -r ../MTG-Card-Library-Windows.zip .
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Card-Library-Windows
          path: MTG-Card-Library-Windows.zip
          if-no-files-found: error
