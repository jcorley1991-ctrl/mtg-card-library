plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jcorley.mtgcardlibrary'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jcorley.mtgcardlibrary'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0-phase1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
