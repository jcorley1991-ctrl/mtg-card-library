name: TCG Scanner Android

on:
  pull_request:
    paths:
      - 'scanner/**'
      - '.github/workflows/tcg-scanner.yml'
  workflow_dispatch:

jobs:
  build-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build scanner APK
        run: gradle -p scanner :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp scanner/app/build/outputs/apk/debug/app-debug.apk TCG-Scanner-V1.apk
      - name: Upload scanner APK
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Scanner-V1
          path: TCG-Scanner-V1.apk
          if-no-files-found: error
